<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Sửa lỗi hiển thị - Camera sau</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        #webcam {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: -2;
        }
        #info {
            position: absolute; top: 10px; left: 10px; z-index: 10;
            background: rgba(255,255,255,0.9); color: #000; padding: 10px;
            font-family: Arial; border-radius: 5px; font-size: 13px;
        }
    </style>
</head>
<body>

    <div id="info">Đang khởi động Camera sau...</div>
    <video id="webcam" autoplay playsinline></video>

    <a-scene embedded vr-mode-ui="enabled: false" renderer="alpha: true;">
        <a-box id="box" position="0 1.5 -2" width="0.3" height="0.3" depth="0.3" color="#FF0000" visible="false"></a-box>
        
        <a-sphere position="0 1 -3" radius="0.1" color="#FFFF00"></a-sphere>

        <a-entity light="type: ambient; intensity: 2"></a-entity>
        <a-entity camera position="0 1.6 0"></a-entity>
    </a-scene>

    <script>
        const videoElement = document.getElementById('webcam');
        const box = document.getElementById('box');
        const info = document.getElementById('info');

        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({ 
            maxNumHands: 1, 
            modelComplexity: 1, 
            minDetectionConfidence: 0.6, 
            minTrackingConfidence: 0.6 
        });

        hands.onResults((results) => {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                box.setAttribute('visible', 'true');
                const palm = results.multiHandLandmarks[0][9]; // Lòng bàn tay
                
                // CÔNG THỨC CHO CAMERA SAU:
                // X: palm.x từ 0(trái) đến 1(phải). Đưa về -2 đến 2.
                const x = (palm.x - 0.5) * 4; 
                const y = (0.5 - palm.y) * 3 + 1.5;
                const z = -2.5; // Giữ khoảng cách cố định để dễ quan sát

                box.setAttribute('position', {x: x, y: y, z: z});
                info.innerText = `Đã thấy tay! Tọa độ AR: X=${x.toFixed(2)} Y=${y.toFixed(2)}`;
            } else {
                box.setAttribute('visible', 'false');
                info.innerText = "Đang quét tìm bàn tay qua camera sau...";
            }
        });

        const camera = new Camera(videoElement, {
            onFrame: async () => { await hands.send({image: videoElement}); },
            facingMode: 'environment', // ÉP DÙNG CAMERA SAU
            width: 1280,
            height: 720
        });
        camera.start().catch(err => {
            info.innerText = "Lỗi Camera: " + err;
        });
    </script>
</body>
</html>
