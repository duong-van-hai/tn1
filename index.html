<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>AR Hand - Main Camera</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        #webcam {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: -2;
            /* Bỏ transform: scaleX(-1) vì camera sau không cần chế độ gương */
        }
        #info {
            position: absolute; top: 10px; left: 10px; z-index: 10;
            background: rgba(0,0,0,0.8); color: white; padding: 12px;
            font-family: sans-serif; border-radius: 8px;
        }
    </style>
</head>
<body>

    <div id="info">Đang mở CAMERA SAU... Hãy đưa tay vào khung hình</div>
    <video id="webcam" autoplay playsinline></video>

    <a-scene embedded vr-mode-ui="enabled: false" renderer="alpha: true;">
        <a-box id="box" width="0.3" height="0.3" depth="0.3" color="#FFD700" visible="false"></a-box>
        <a-entity light="type: ambient; intensity: 1.5"></a-entity>
        <a-entity camera position="0 1.6 0"></a-entity>
    </a-scene>

    <script>
        const videoElement = document.getElementById('webcam');
        const box = document.getElementById('box');
        const info = document.getElementById('info');

        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({ 
            maxNumHands: 1, 
            modelComplexity: 1, 
            minDetectionConfidence: 0.7, 
            minTrackingConfidence: 0.7 
        });

        hands.onResults((results) => {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                box.setAttribute('visible', 'true');
                const landmarks = results.multiHandLandmarks[0];
                const palm = landmarks[9];
                
                // Tọa độ X: Không đảo ngược vì camera sau không phải gương
                const x = (palm.x - 0.5) * 4; 
                const y = (0.5 - palm.y) * 3 + 1.5;
                const z = -2 + (palm.z * 2); 

                box.setAttribute('position', {x: x, y: y, z: z});
                box.setAttribute('rotation', `0 ${x * -20} 0`);
            } else {
                box.setAttribute('visible', 'false');
            }
        });

        // CẤU HÌNH CAMERA SAU
        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({image: videoElement});
            },
            // facingMode: 'environment' là lệnh ép trình duyệt dùng camera sau
            facingMode: 'environment', 
            width: 1280,
            height: 720
        });
        camera.start();
    </script>
</body>
</html>
