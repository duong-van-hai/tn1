<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>AR Emergency Check</title>
    <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    
    <div id="error-log" style="position: absolute; top: 10px; left: 10px; z-index: 999; color: white; background: rgba(255,0,0,0.8); padding: 10px; font-family: Arial; display: none;">
      Trình duyệt của bạn không hỗ trợ WebGL hoặc bị chặn thư viện.
    </div>

    <video id="v" autoplay playsinline style="position:fixed; top:0; left:0; min-width:100%; min-height:100%; z-index:-1;"></video>

    <a-scene embedded vr-mode-ui="enabled: false" renderer="alpha: true;">
      <a-sphere position="0 1 -2" radius="0.5" color="#FF00FF"></a-sphere>
      
      <a-light type="ambient" intensity="2"></a-light>
      <a-entity camera></a-entity>
    </a-scene>

    <script>
      // Mở camera chính
      navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
        .then(s => { document.getElementById('v').srcObject = s; })
        .catch(e => { 
            document.getElementById('error-log').style.display = 'block';
            document.getElementById('error-log').innerText = "Lỗi Camera: " + e;
        });
    </script>
  </body>
</html>
