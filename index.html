<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>AR Auto Display - Main Camera</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        /* Hiển thị camera sau làm nền */
        #webcam {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover; z-index: -1;
        }
        #ui {
            position: absolute; bottom: 20px; left: 50%;
            transform: translateX(-50%); z-index: 10;
            background: rgba(0,0,0,0.6); color: white;
            padding: 10px 20px; border-radius: 20px; font-family: sans-serif;
        }
    </style>
</head>
<body>

    <div id="ui">Mô hình AR Động cơ/Vật thể (Camera Sau)</div>
    
    <video id="webcam" autoplay playsinline></video>

    <a-scene embedded vr-mode-ui="enabled: false" renderer="alpha: true;">
        
        <a-entity id="target-object" position="0 1.2 -1">
            <a-box width="0.3" height="0.3" depth="0.3" color="#FFD700"
                   animation="property: rotation; to: 0 360 0; loop: true; dur: 5000">
            </a-box>
            
            <a-text value="MO HINH 3D" align="center" position="0 0.5 0" scale="0.5 0.5 0.5"></a-text>
        </a-entity>

        <a-entity light="type: ambient; intensity: 1"></a-entity>
        <a-entity light="type: directional; intensity: 0.8" position="-1 2 1"></a-entity>
        
        <a-entity camera></a-entity>
    </a-scene>

    <script>
        // Lệnh kích hoạt Camera sau
        const video = document.getElementById('webcam');
        
        navigator.mediaDevices.getUserMedia({
            video: { facingMode: "environment" }, // Ưu tiên camera sau
            audio: false
        })
        .then(stream => {
            video.srcObject = stream;
        })
        .catch(err => {
            console.error("Lỗi truy cập camera: ", err);
            alert("Vui lòng cho phép quyền truy cập Camera để xem AR.");
        });
    </script>
</body>
</html>
