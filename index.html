<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Gamification AR - Pokemon Power</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">
    <video id="webcam" style="position: absolute; width: 100%; height: 100%; object-fit: cover; z-index: -2; transform: scaleX(-1);" autoplay playsinline></video>

    <a-scene embedded vr-mode-ui="enabled: false" renderer="alpha: true;">
        <a-entity id="pokemon" visible="false">
            <a-sphere id="body" radius="0.25" color="#FFFF00"></a-sphere>
            <a-cone radius-bottom="0.05" height="0.3" color="#FFFF00" position="-0.15 0.25 0" rotation="0 0 20"></a-cone>
            <a-cone radius-bottom="0.05" height="0.3" color="#FFFF00" position="0.15 0.25 0" rotation="0 0 -20"></a-cone>
            <a-torus-knot id="lightning" radius="0.3" radius-tubular="0.01" color="#00FFFF" visible="false" animation="property: rotation; to: 0 360 0; loop: true; dur: 500"></a-torus-knot>
        </a-entity>

        <a-entity light="type: ambient; intensity: 1.5"></a-entity>
        <a-entity camera position="0 1.6 0"></a-entity>
    </a-scene>

    <script>
        const videoElement = document.getElementById('webcam');
        const pokemon = document.getElementById('pokemon');
        const body = document.getElementById('body');
        const lightning = document.getElementById('lightning');

        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.7, minTrackingConfidence: 0.7 });

        hands.onResults((results) => {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                pokemon.setAttribute('visible', 'true');
                
                // Tọa độ lòng bàn tay
                const palm = landmarks[9];
                pokemon.setAttribute('position', `${(0.5 - palm.x) * 4} ${(0.5 - palm.y) * 3 + 1.5} ${-2 + palm.z * 2}`);

                // Kiểm tra cử chỉ kẹp ngón tay (Pinch) để "Phóng điện"
                const dist = Math.sqrt(Math.pow(landmarks[4].x - landmarks[8].x, 2) + Math.pow(landmarks[4].y - landmarks[8].y, 2));
                
                if (dist < 0.05) {
                    body.setAttribute('color', '#00FFFF'); // Đổi sang màu điện
                    lightning.setAttribute('visible', 'true');
                } else {
                    body.setAttribute('color', '#FFFF00'); // Trở lại màu vàng
                    lightning.setAttribute('visible', 'false');
                }
            } else {
                pokemon.setAttribute('visible', 'false');
            }
        });

        const camera = new Camera(videoElement, {
            onFrame: async () => { await hands.send({image: videoElement}); },
            width: 1280, height: 720
        });
        camera.start();
    </script>
</body>
</html>
