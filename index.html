<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>AR Fix 100% - Motor Engine</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        #webcam { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: -1; }
        .controls {
            position: absolute; bottom: 20px; left: 10px; z-index: 10;
            display: flex; flex-direction: column; gap: 10px;
        }
        button {
            padding: 10px; background: rgba(255,255,255,0.8); border: none; border-radius: 5px; font-weight: bold;
        }
    </style>
</head>
<body>

    <video id="webcam" autoplay playsinline></video>

    <div class="controls">
        <button onclick="adjust('scale', 1.2)">Phóng to (+)</button>
        <button onclick="adjust('scale', 0.8)">Thu nhỏ (-)</button>
        <button onclick="adjust('z', 0.5)">Đẩy ra xa</button>
        <button onclick="adjust('z', -0.5)">Kéo lại gần</button>
    </div>

    <a-scene embedded vr-mode-ui="enabled: false" renderer="alpha: true; colorManagement: true;">
        <a-assets>
            <a-asset-item id="engine" src="motorcycle_4_stroke_engine.glb"></a-asset-item>
        </a-assets>

        <a-box id="test-box" position="-0.5 1 -1.5" radius="0.1" color="red"></a-box>

        <a-entity id="motor" 
                  gltf-model="#engine" 
                  position="0 1.2 -2" 
                  scale="1 1 1" 
                  animation-mixer>
        </a-entity>

        <a-entity light="type: ambient; intensity: 2"></a-entity>
        <a-entity light="type: directional; intensity: 1" position="-1 2 1"></a-entity>
        <a-entity camera></a-entity>
    </a-scene>

    <script>
        // Kích hoạt Camera sau
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
            .then(s => { document.getElementById('webcam').srcObject = s; });

        // Hàm điều chỉnh vật thể bằng nút bấm
        function adjust(type, value) {
            const motor = document.getElementById('motor');
            if(type === 'scale') {
                let s = motor.getAttribute('scale');
                motor.setAttribute('scale', {x: s.x * value, y: s.y * value, z: s.z * value});
            } else if(type === 'z') {
                let p = motor.getAttribute('position');
                motor.setAttribute('position', {x: p.x, y: p.y, z: p.z + value});
            }
        }
    </script>
</body>
</html>
