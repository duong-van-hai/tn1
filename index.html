<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Động Cơ 4 Thì - Chế độ AR (Cử chỉ tay)</title>
    <style>
        /* Nền tối chuyên nghiệp */
        body { 
            margin: 0; 
            background-color: #121212; 
        }

        model-viewer {
            width: 100%;
            height: 100vh;
            --poster-color: transparent;
            background: radial-gradient(circle, #2c3e50 0%, #000000 100%);
        }

        /* Tùy chỉnh nút AR */
        #ar-button {
            background-color: #222222;
            color: #ffffff;
            border-radius: 8px;
            border: 1px solid #444444;
            padding: 12px 20px;
            font-family: sans-serif;
            font-weight: 600;
            font-size: 14px;
            position: absolute;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%);
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background-color 0.3s;
        }

        #ar-button:active {
            background-color: #444444;
        }

        /* Thông báo trạng thái */
        #ar-status {
            position: absolute;
            bottom: 85px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.7);
            font-family: sans-serif;
            font-size: 12px;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>

    <model-viewer 
        src="motorcycle_4_stroke_engine.glb" 
        ar 
        ar-modes="webxr scene-viewer quick-look" 
        ar-scale="auto" 
        camera-controls 
        touch-action="pan-y"
        shadow-intensity="2" 
        autoplay 
        auto-rotate
        camera-orbit="auto auto auto"
        exposure="1.2"
        environment-image="neutral">
        
        <button slot="ar-button" id="ar-button">
            <span>👋</span> Xem trong không gian thật (AR)
        </button>

        <div slot="ar-status" id="ar-status">
            Dùng 2 ngón tay để phóng to/thu nhỏ
        </div>
    </model-viewer>

</body>
</html>
