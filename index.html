<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>AR Hand Tracking - Final Fix</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        #webcam { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; }
        #info {
            position: absolute; top: 10px; left: 10px; z-index: 10;
            background: rgba(255,255,255,0.9); color: #333; padding: 15px;
            font-family: sans-serif; border-radius: 10px; border: 2px solid #FF0000;
        }
    </style>
</head>
<body>

    <div id="info">Đang quét tìm tay... <br>Hãy đưa tay cách Camera khoảng 50cm.</div>
    <video id="webcam" autoplay playsinline></video>

    <a-scene embedded vr-mode-ui="enabled: false" renderer="alpha: true; antialias: true;">
        <a-entity id="hand-group" visible="false">
            <a-box width="0.4" height="0.4" depth="0.4" color="#FF0000" 
                   animation="property: rotation; to: 0 360 0; loop: true; dur: 4000"></a-box>
            <a-cone radius-bottom="0.1" height="0.2" color="#00FF00" position="0 0.5 0"></a-cone>
        </a-entity>
        
        <a-sphere position="0 0.5 -3" radius="0.05" color="#FFFF00"></a-sphere>

        <a-entity light="type: ambient; intensity: 1.5"></a-entity>
        <a-entity light="type: directional; intensity: 1" position="-1 2 1"></a-entity>
        <a-entity camera position="0 1.6 0"></a-entity>
    </a-scene>

    <script>
        const videoElement = document.getElementById('webcam');
        const info = document.getElementById('info');
        const handGroup = document.getElementById('hand-group');

        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1, // Dùng model nhẹ để load nhanh trên điện thoại
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        hands.onResults((results) => {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                handGroup.setAttribute('visible', 'true');
                const palm = results.multiHandLandmarks[0][9]; 
                
                // Tọa độ cho Camera sau (Môi trường thực tế)
                const x = (palm.x - 0.5) * 5; 
                const y = (0.5 - palm.y) * 4 + 1.5;
                const z = -2.5; // Đưa về khoảng cách vàng để mắt dễ nhìn thấy

                handGroup.setAttribute('position', {x: x, y: y, z: z});
                info.innerHTML = `<span style="color:green">ĐÃ THẤY TAY!</span><br>Vị trí X: ${x.toFixed(1)} | Y: ${y.toFixed(1)}`;
            } else {
                handGroup.setAttribute('visible', 'false');
                info.innerHTML = `<span style="color:red">CHƯA THẤY TAY</span><br>Di chuyển tay chậm lại hoặc ra xa camera.`;
            }
        });

        const camera = new Camera(videoElement, {
            onFrame: async () => { await hands.send({image: videoElement}); },
            facingMode: 'environment', // Ép dùng camera chính
            width: 1280, height: 720
        });
        camera.start();
    </script>
</body>
</html>
