<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Trắc nghiệm EdTech</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; padding: 20px; line-height: 1.6; }
        .container { max-width: 850px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #1a73e8; }
        .section-header { background: #e8f0fe; padding: 10px 15px; border-left: 5px solid #1a73e8; margin: 25px 0 15px 0; font-weight: bold; }
        .question { margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px dashed #ddd; }
        .question-text { font-weight: 600; margin-bottom: 10px; display: block; }
        .options { display: grid; gap: 8px; }
        .options label { padding: 10px; border: 1px solid #eee; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        .options label:hover { background: #f8f9fa; border-color: #1a73e8; }
        input[type="radio"], input[type="checkbox"] { margin-right: 10px; }
        #submit-btn { display: block; width: 100%; padding: 15px; background: #1a73e8; color: white; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; margin-top: 20px; }
        #submit-btn:hover { background: #1557b0; }
        #result { margin-top: 20px; padding: 20px; border-radius: 8px; display: none; text-align: center; font-size: 20px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>BÀI KIỂM TRA TRẮC NGHIỆM</h1>
    
    <div id="quiz-content">
        </div>

    <button id="submit-btn" onclick="checkResults()">Nộp bài và Chấm điểm</button>
    <div id="result"></div>
</div>

<script>
// 1. NGÂN HÀNG CÂU HỎI MẪU
const bank = {
    A: Array.from({length: 15}, (_, i) => ({ id: `A${i}`, text: `Câu hỏi đơn bộ A - số ${i+1}?`, options: ["Đáp án 1", "Đáp án 2", "Đáp án 3", "Đáp án 4"], correct: 0 })),
    B: Array.from({length: 15}, (_, i) => ({ id: `B${i}`, text: `Câu hỏi đơn bộ B - số ${i+1}?`, options: ["Đáp án A", "Đáp án B", "Đáp án C", "Đáp án D"], correct: 1 })),
    C: Array.from({length: 5}, (_, i) => ({ id: `C${i}`, text: `Câu hỏi NHIỀU ĐÁP ÁN bộ C - số ${i+1}?`, options: ["Đúng 1", "Đúng 2", "Sai 1", "Sai 2"], correct: [0, 1] })),
    D: Array.from({length: 5}, (_, i) => ({ id: `D${i}`, text: `Câu hỏi NHIỀU ĐÁP ÁN bộ D - số ${i+1}?`, options: ["Lựa chọn A", "Lựa chọn B", "Lựa chọn C", "Lựa chọn D"], correct: [2, 3] }))
};

// 2. LOGIC TRỘN VÀ LẤY CÂU HỎI
function getRand(arr, n) {
    return arr.sort(() => 0.5 - Math.random()).slice(0, n);
}

const selectedQuestions = [
    ...getRand(bank.A, 6).map(q => ({...q, type: 'single'})),
    ...getRand(bank.B, 6).map(q => ({...q, type: 'single'})),
    ...getRand(bank.C, 2).map(q => ({...q, type: 'multi'})),
    ...getRand(bank.D, 2).map(q => ({...q, type: 'multi'}))
];

// 3. HIỂN THỊ CÂU HỎI LÊN GIAO DIỆN
const container = document.getElementById('quiz-content');

function renderQuiz() {
    let html = '';
    selectedQuestions.forEach((q, index) => {
        if (index === 0) html += '<div class="section-header">PHẦN 1: TRẮC NGHIỆM 1 ĐÁP ÁN (12 câu)</div>';
        if (index === 12) html += '<div class="section-header">PHẦN 2: TRẮC NGHIỆM NHIỀU ĐÁP ÁN (4 câu)</div>';

        html += `
            <div class="question" id="q-container-${index}">
                <span class="question-text">Câu ${index + 1}: ${q.text}</span>
                <div class="options">
                    ${q.options.map((opt, i) => `
                        <label>
                            <input type="${q.type === 'single' ? 'radio' : 'checkbox'}" 
                                   name="q${index}" value="${i}">
                            ${opt}
                        </label>
                    `).join('')}
                </div>
            </div>
        `;
    });
    container.innerHTML = html;
}

// 4. CHẤM ĐIỂM
function checkResults() {
    let score = 0;
    selectedQuestions.forEach((q, index) => {
        const inputs = document.querySelectorAll(`input[name="q${index}"]:checked`);
        const userAnswers = Array.from(inputs).map(i => parseInt(i.value));
        
        if (q.type === 'single') {
            if (userAnswers[0] === q.correct) score++;
        } else {
            // Kiểm tra nhiều đáp án (phải đúng hoàn toàn)
            const isCorrect = JSON.stringify(userAnswers.sort()) === JSON.stringify(q.correct.sort());
            if (isCorrect) score++;
        }
    });

    const resDiv = document.getElementById('result');
    resDiv.style.display = 'block';
    resDiv.innerHTML = `Kết quả: ${score} / ${selectedQuestions.length} câu đúng!`;
    resDiv.style.background = score > 8 ? '#d4edda' : '#f8d7da';
    window.scrollTo(0, document.body.scrollHeight);
}

renderQuiz();
</script>

</body>
</html>
