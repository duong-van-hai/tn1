<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Debug AR - Check Display</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        #webcam { 
            position: absolute; top: 0; left: 0; 
            width: 100%; height: 100%; 
            object-fit: cover; z-index: -1; 
        }
        #status-bar {
            position: absolute; top: 10px; width: 100%;
            text-align: center; z-index: 10;
            color: white; font-family: sans-serif;
            background: rgba(255, 0, 0, 0.5); padding: 5px;
        }
    </style>
</head>
<body>

    <div id="status-bar">Đang kiểm tra đồ họa AR...</div>
    <video id="webcam" autoplay playsinline></video>

    <a-scene embedded vr-mode-ui="enabled: false" renderer="alpha: true;">
        
        <a-sphere position="0 1.2 -1" radius="0.2" color="#FF00FF"
                  animation="property: position; dir: alternate; dur: 1000; easing: easeInSine; loop: true; to: 0 1.4 -1">
        </a-sphere>

        <a-entity light="type: ambient; intensity: 2"></a-entity>
        
        <a-entity camera></a-entity>
    </a-scene>

    <script>
        const statusBar = document.getElementById('status-bar');
        
        // Bước 1: Kiểm tra Camera
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
            .then(stream => {
                document.getElementById('webcam').srcObject = stream;
                statusBar.innerText = "CAMERA OK - Tìm khối cầu màu hồng!";
                statusBar.style.background = "green";
            })
            .catch(err => {
                statusBar.innerText = "LỖI CAMERA: " + err.name;
            });
    </script>
</body>
</html>
