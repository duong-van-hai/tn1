<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Trắc nghiệm EdTech Pro</title>
    <style>
        :root { --primary: #1a73e8; --success: #28a745; --danger: #dc3545; --gray: #f8f9fa; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #eef2f7; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        
        /* Màn hình đăng nhập */
        #login-screen { text-align: center; }
        input[type="text"] { width: 80%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; }
        
        /* Header thông tin */
        #quiz-header { display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: white; padding: 10px 0; border-bottom: 2px solid var(--primary); z-index: 100; margin-bottom: 20px; }
        #timer { font-size: 20px; font-weight: bold; color: var(--danger); border: 2px solid var(--danger); padding: 5px 15px; border-radius: 20px; }

        /* Câu hỏi */
        .question { margin-bottom: 30px; padding: 20px; border: 1px solid #eee; border-radius: 10px; background: #fff; }
        .question-title { font-weight: bold; margin-bottom: 15px; display: block; color: #333; }
        .options { display: grid; gap: 10px; }
        .options label { padding: 12px; border: 1px solid #ddd; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        .options label:hover { background: #f1f3f4; }
        input[type="radio"], input[type="checkbox"] { transform: scale(1.2); margin-right: 10px; }

        /* Review câu hỏi */
        .correct-ans { background: #d4edda !important; border-color: #28a745 !important; }
        .wrong-ans { background: #f8d7da !important; border-color: #dc3545 !important; }
        .explanation { margin-top: 10px; font-size: 14px; font-style: italic; color: #555; }

        /* Nút bấm */
        .btn { background: var(--primary); color: white; border: none; padding: 12px 30px; border-radius: 8px; cursor: pointer; font-size: 16px; transition: 0.3s; }
        .btn:hover { background: #1557b0; opacity: 0.9; }
        .hidden { display: none; }
        
        .section-tag { background: #e8f0fe; color: var(--primary); padding: 4px 12px; border-radius: 15px; font-size: 12px; font-weight: bold; margin-bottom: 10px; display: inline-block; }
    </style>
</head>
<body>

<div class="container">
    <div id="login-screen">
        <h1>BÀI KIỂM TRA ĐỊNH KỲ</h1>
        <p>Vui lòng nhập thông tin để bắt đầu</p>
        <input type="text" id="student-name" placeholder="Họ và tên thí sinh..." required><br>
        <input type="text" id="student-class" placeholder="Lớp (Ví dụ: 12A1)..." required><br>
        <button class="btn" onclick="startQuiz()">Bắt đầu làm bài</button>
    </div>

    <div id="quiz-screen" class="hidden">
        <div id="quiz-header">
            <div>
                <b id="display-name"></b> - <span id="display-class"></span>
            </div>
            <div id="timer">15:00</div>
        </div>
        
        <div id="quiz-body"></div>
        <button class="btn" id="submit-btn" onclick="finishQuiz()" style="width: 100%; margin-top: 20px;">Nộp bài</button>
    </div>

    <div id="result-screen" class="hidden">
        <h2 style="text-align:center">KẾT QUẢ BÀI LÀM</h2>
        <div id="score-box" style="text-align:center; font-size: 24px; margin: 20px 0; padding: 20px; border-radius: 10px;"></div>
        <div id="review-body"></div>
        <button class="btn" onclick="location.reload()" style="width: 100%">Làm lại bài khác</button>
    </div>
</div>

<script>
// --- DỮ LIỆU BỘ ĐỀ MẪU (BẠN CÓ THỂ THAY ĐỔI Ở ĐÂY) ---
const bank = {
    A: Array.from({length: 10}, (_, i) => ({ text: `[Bộ A] Câu hỏi đơn số ${i+1}: Thủ đô của Việt Nam là gì?`, options: ["Hà Nội", "Đà Nẵng", "TP.HCM", "Huế"], correct: 0 })),
    B: Array.from({length: 10}, (_, i) => ({ text: `[Bộ B] Câu hỏi đơn số ${i+1}: 5 + 5 bằng bao nhiêu?`, options: ["5", "10", "15", "20"], correct: 1 })),
    C: Array.from({length: 5}, (_, i) => ({ text: `[Bộ C] Câu hỏi nhiều đáp án ${i+1}: Những số nào là số chẵn?`, options: ["2", "3", "4", "5"], correct: [0, 2] })),
    D: Array.from({length: 5}, (_, i) => ({ text: `[Bộ D] Câu hỏi nhiều đáp án ${i+1}: Các trình duyệt web là?`, options: ["Chrome", "Facebook", "Firefox", "Zalo"], correct: [0, 2] }))
};

let selectedQuestions = [];
let timeLeft = 15 * 60; // 15 phút
let timerInterval;

// Lấy ngẫu nhiên câu hỏi
function getRand(arr, n) { return arr.sort(() => 0.5 - Math.random()).slice(0, n); }

function startQuiz() {
    const name = document.getElementById('student-name').value;
    const sClass = document.getElementById('student-class').value;

    if (!name || !sClass) { alert("Vui lòng nhập đầy đủ tên và lớp!"); return; }

    // Hiển thị thông tin
    document.getElementById('display-name').innerText = name;
    document.getElementById('display-class').innerText = sClass;
    document.getElementById('login-screen').classList.add('hidden');
    document.getElementById('quiz-screen').classList.remove('hidden');

    // Tạo bộ đề theo cấu trúc yêu cầu
    selectedQuestions = [
        ...getRand(bank.A, 6).map(q => ({...q, type: 'single'})),
        ...getRand(bank.B, 6).map(q => ({...q, type: 'single'})),
        ...getRand(bank.C, 2).map(q => ({...q, type: 'multi'})),
        ...getRand(bank.D, 2).map(q => ({...q, type: 'multi'}))
    ];

    renderQuiz();
    startTimer();
}

function renderQuiz() {
    let html = '';
    selectedQuestions.forEach((q, idx) => {
        const tag = idx < 12 ? "Phần 1: Chọn 1 đáp án" : "Phần 2: Chọn nhiều đáp án";
        html += `
            <div class="question" id="q-${idx}">
                <div class="section-tag">${tag}</div>
                <div class="question-title">Câu ${idx+1}: ${q.text}</div>
                <div class="options">
                    ${q.options.map((opt, i) => `
                        <label>
                            <input type="${q.type === 'single' ? 'radio' : 'checkbox'}" name="q${idx}" value="${i}">
                            ${opt}
                        </label>
                    `).join('')}
                </div>
            </div>
        `;
    });
    document.getElementById('quiz-body').innerHTML = html;
}

function startTimer() {
    timerInterval = setInterval(() => {
        let mins = Math.floor(timeLeft / 60);
        let secs = timeLeft % 60;
        document.getElementById('timer').innerText = `${mins < 10 ? '0'+mins : mins}:${secs < 10 ? '0'+secs : secs}`;
        if (timeLeft <= 0) { clearInterval(timerInterval); finishQuiz(); }
        timeLeft--;
    }, 1000);
}

function finishQuiz() {
    clearInterval(timerInterval);
    let score = 0;
    let reviewHtml = '<h3>Chi tiết bài làm:</h3>';

    selectedQuestions.forEach((q, idx) => {
        const inputs = document.querySelectorAll(`input[name="q${idx}"]:checked`);
        const userAns = Array.from(inputs).map(i => parseInt(i.value));
        
        let isCorrect = false;
        if (q.type === 'single') {
            isCorrect = userAns[0] === q.correct;
        } else {
            isCorrect = JSON.stringify(userAns.sort()) === JSON.stringify(q.correct.sort());
        }

        if (isCorrect) score++;

        // Tạo giao diện review
        reviewHtml += `
            <div class="question" style="border-left: 5px solid ${isCorrect ? 'var(--success)' : 'var(--danger)'}">
                <div class="question-title">Câu ${idx+1}: ${q.text} ${isCorrect ? '✅' : '❌'}</div>
                <div class="options">
                    ${q.options.map((opt, i) => {
                        let cls = "";
                        if (q.type === 'single') {
                            if (i === q.correct) cls = "correct-ans";
                            if (userAns.includes(i) && i !== q.correct) cls = "wrong-ans";
                        } else {
                            if (q.correct.includes(i)) cls = "correct-ans";
                            if (userAns.includes(i) && !q.correct.includes(i)) cls = "wrong-ans";
                        }
                        return `<label class="${cls}">${opt}</label>`;
                    }).join('')}
                </div>
            </div>`;
    });

    // Hiển thị màn hình kết quả
    document.getElementById('quiz-screen').classList.add('hidden');
    document.getElementById('result-screen').classList.remove('hidden');
    
    const scoreBox = document.getElementById('score-box');
    scoreBox.innerHTML = `Thí sinh: <b>${document.getElementById('student-name').value}</b><br>
                          Số câu đúng: ${score}/${selectedQuestions.length}<br>
                          Điểm số: ${(score/selectedQuestions.length*10).toFixed(2)}`;
    scoreBox.style.background = score >= 8 ? '#d4edda' : '#f8d7da';
    document.getElementById('review-body').innerHTML = reviewHtml;
}
</script>
</body>
</html>
